name: "gt update"

#gt-placeholder-trigger-start
on:
  schedule:
    - cron: '0 4 * * MON'
  workflow_dispatch:
#gt-placeholder-trigger-end

permissions:
  contents: read

jobs:
  determine_remotes:
    name: Determine Remotes
    runs-on: ubuntu-latest

    # gt-placeholder-owner-start
    if: github.repository_owner == 'tegonal'
    # gt-placeholder-owner-end

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Import gpg key(s) defined in vars.PUBLIC_GPG_KEYS_WE_TRUST and secrets.PUBLIC_GPG_KEYS_WE_TRUST
        run: |
          gpg --import - <<< "${{ vars.PUBLIC_GPG_KEYS_WE_TRUST }}" && success=true \
            || (echo "could not import GPG keys via vars.PUBLIC_GPG_KEYS_WE_TRUST -- maybe it's not defined"; exit 1) && \
          false || gpg --import - <<< "${{ secrets.PUBLIC_GPG_KEYS_WE_TRUST }}" && success=true \
            || (echo "could not import GPG keys via secrets.PUBLIC_GPG_KEYS_WE_TRUST -- maybe it's not defined"; exit 1) && \
          false || "${success:-false}" && echo "was able to import GPGs either via vars or secrets (or via both -- see above)"
      - name: Install gt
        run: |
          set -e
          # see install.doc.sh in https://github.com/tegonal/gt, MODIFY THERE NOT HERE (please report bugs)
          #!/usr/bin/env bash
          currentDir=$(pwd) &&
          	tmpDir=$(mktemp -d -t gt-download-install-XXXXXXXXXX) && cd "$tmpDir" &&
          	wget "https://raw.githubusercontent.com/tegonal/gt/main/.gt/signing-key.public.asc" &&
          	wget "https://raw.githubusercontent.com/tegonal/gt/main/.gt/signing-key.public.asc.sig" &&
          	gpg --verify ./signing-key.public.asc.sig ./signing-key.public.asc &&
          	echo "public key trusted" &&
          	mkdir ./gpg &&
          	gpg --homedir ./gpg --import ./signing-key.public.asc &&
          	wget "https://raw.githubusercontent.com/tegonal/gt/v1.4.4/install.sh" &&
          	wget "https://raw.githubusercontent.com/tegonal/gt/v1.4.4/install.sh.sig" &&
          	gpg --homedir ./gpg --verify ./install.sh.sig ./install.sh &&
          	chmod +x ./install.sh &&
          	echo "verification successful" ||
          	{
          		printf >&2 "\033[0;31mERROR\033[0m: verification failed, don't continue !!\n"
          		exit 1
          	} && ./install.sh && result=true ||
          	{
          		echo >&2 "installation failed"
          		exit 1
          	} && false || cd "$currentDir" && rm -r "$tmpDir" && "${result:-false}"
          # end install.doc.sh
      #gt-placeholder-gh-action-checkout-1-start
      - uses: actions/checkout@v7
      #gt-placeholder-gh-action-checkout-1-end
      - id: set-matrix
        run: |
          (readarray -t REMOTES; IFS=','; echo "matrix={ 'remote': [ ${REMOTES[*]} ] }" >> "$GITHUB_OUTPUT") < <( gt remote list | sed -E "s/(.*)/'\1'/")
  Update:
    needs: determine_remotes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.determine_remotes.outputs.matrix) }}
    name: 'Update ${{ matrix.remote }}'
    steps:
      - name: Import gpg key(s) defined in vars.PUBLIC_GPG_KEYS_WE_TRUST and secrets.PUBLIC_GPG_KEYS_WE_TRUST
        run: |
          gpg --import - <<< "${{ vars.PUBLIC_GPG_KEYS_WE_TRUST }}" && success=true \
            || (echo "could not import GPG keys via vars.PUBLIC_GPG_KEYS_WE_TRUST -- maybe it's not defined"; exit 1) && \
          false || gpg --import - <<< "${{ secrets.PUBLIC_GPG_KEYS_WE_TRUST }}" && success=true \
            || (echo "could not import GPG keys via secrets.PUBLIC_GPG_KEYS_WE_TRUST -- maybe it's not defined"; exit 1) && \
          false || "${success:-false}" && echo "was able to import GPGs either via vars or secrets (or via both -- see above)"
      - name: Install gt
        run: |
          set -e
          # see install.doc.sh in https://github.com/tegonal/gt, MODIFY THERE NOT HERE (please report bugs)
          #!/usr/bin/env bash
          currentDir=$(pwd) &&
          	tmpDir=$(mktemp -d -t gt-download-install-XXXXXXXXXX) && cd "$tmpDir" &&
          	wget "https://raw.githubusercontent.com/tegonal/gt/main/.gt/signing-key.public.asc" &&
          	wget "https://raw.githubusercontent.com/tegonal/gt/main/.gt/signing-key.public.asc.sig" &&
          	gpg --verify ./signing-key.public.asc.sig ./signing-key.public.asc &&
          	echo "public key trusted" &&
          	mkdir ./gpg &&
          	gpg --homedir ./gpg --import ./signing-key.public.asc &&
          	wget "https://raw.githubusercontent.com/tegonal/gt/v1.4.4/install.sh" &&
          	wget "https://raw.githubusercontent.com/tegonal/gt/v1.4.4/install.sh.sig" &&
          	gpg --homedir ./gpg --verify ./install.sh.sig ./install.sh &&
          	chmod +x ./install.sh &&
          	echo "verification successful" ||
          	{
          		printf >&2 "\033[0;31mERROR\033[0m: verification failed, don't continue !!\n"
          		exit 1
          	} && ./install.sh && result=true ||
          	{
          		echo >&2 "installation failed"
          		exit 1
          	} && false || cd "$currentDir" && rm -r "$tmpDir" && "${result:-false}"
          # end install.doc.sh
      #gt-placeholder-gh-action-checkout-2-start
      - uses: actions/checkout@v7
      #gt-placeholder-gh-action-checkout-2-end
      - name: reset gpg keys
        run: gt reset --gpg-only true -r "${{ matrix.remote }}"
      - name: gt update
        run: gt update -r "${{ matrix.remote }}"
      - id: has_changes
        name: git status
        run: |
          set -euo pipefail
          git status
          gitStatus=$(git status --porcelain)
          (if [[ $gitStatus != "" ]]; then echo "has_changes=1"; else echo "has_changes=0"; fi) >> $GITHUB_OUTPUT
      - id: determine_versions
        if: ${{ steps.has_changes.outputs.has_changes == 1 }}
        run: |
          set -euo pipefail

          pulledTsv=".gt/remotes/${{ matrix.remote }}/pulled.tsv"
          allowedVersionRegex='^[a-zA-Z0-9._-]+$'
          isMigration=false

          # pulled.tsv has two header lines (version pragma + column names), data starts at line 3
          dataStartLine=3

          # tag + file of every entry as "tag<TAB>file", so we also notice a file which moved to another tag
          oldEntries=$(git show "HEAD:$pulledTsv" | tail -n +"$dataStartLine" | cut -f1,2 | sort --version-sort)
          newEntries=$(tail -n +"$dataStartLine" "$pulledTsv" | cut -f1,2 | sort --version-sort)

          changedFiles=$(git diff --name-only)

          # find out if we really have updates or if gt was updated and we merely migrated the pulled.tsv to a new version
          if [[ "$changedFiles" == "$pulledTsv" ]]; then
            oldPragma=$(git show "HEAD:$pulledTsv" | sed -n '1p')
            newPragma=$(head -n 1 "$pulledTsv")

            if [[ $oldPragma != "$newPragma" ]]; then
              # If some tag/file combination changed, then we consider it an update, even if no file content changed.
              # Might be the files we fetched did not change in this release but we still update to a new version ...
              if [[ "$oldEntries" == "$newEntries" ]]; then
                # ... however, if tag and file are the same then it is solely a migration
                isMigration=true
                migrationVersion="${newPragma#"#@ Version: "}"
                [[ $migrationVersion =~ $allowedVersionRegex ]] || {
                  echo >&2 "ERROR: migration version '$migrationVersion' does not match $allowedVersionRegex => something is odd, aborting."
                  exit 1
                }
                echo "commit_message=migrate pulled.tsv of remote ${{ matrix.remote }} to version $migrationVersion" >>"$GITHUB_OUTPUT"
              fi
            fi
          fi

          if [[ "$isMigration" == false ]]; then
            # entries present now but not in HEAD, reduced to their tag (grep exits 1 on no match, hence || true)
            mapfile -t newTags < <(
              { grep -vxFf <(printf '%s\n' "$oldEntries") <<<"$newEntries" || true; } |
                cut -f1 |
                sort -u --version-sort
            )

            if ((${#newTags[@]} == 0)); then
              echo >&2 "ERROR: could not find any new tags in $pulledTsv => something is odd (did you remove entries in a pull-hook?), aborting."
              exit 1
            fi

            for t in "${newTags[@]}"; do
              [[ "$t" =~ $allowedVersionRegex ]] || {
                echo >&2 "ERROR: tag '$t' does not match $allowedVersionRegex => something is odd, aborting."
                exit 1
              }
            done

            newVersionsStr=$(IFS=, printf '%s' "${newTags[*]}")

            echo "commit_message=update files of remote ${{ matrix.remote }} to version(s) $newVersionsStr via gt" >>"$GITHUB_OUTPUT"
          fi

      - name: git commit
        if: ${{ steps.has_changes.outputs.has_changes == 1 }}
        id: git_commit
        run: |
          set -euo pipefail
          git config --local user.name 'tegonal-bot'
          git config --local user.email 'tegonal-bot@users.noreply.github.com'
          git commit -am '${{ steps.determine_versions.outputs.commit_message }}' || true
      - name: cleanup-on-push-to-main
        if: ${{ steps.has_changes.outputs.has_changes == 1 && hashFiles('./scripts/cleanup-on-push-to-main.sh') != '' }}
        run: |
          (
              ./scripts/cleanup-on-push-to-main.sh || (printf '\033[0;31mERROR\033[0m: during cleanup, see error above\n' && false) &&
              (git commit -am 'cleanup after gt update for remote ${{ matrix.remote }}' || (printf '\033[0;31mERROR\033[0m: during commit, maybe no changes due to cleanup (which would be fine)?, see above\n'; false ))
          ) || (printf '\033[0;34mINFO\033[0m: going to reset changes back to the status after `gt update` and continue without cleanup\n' && git reset --hard)
      - name: Create pull request if necessary
        if: ${{ steps.has_changes.outputs.has_changes == 1 }}
        #gt-placeholder-gh-action-create-pr-start
        uses: peter-evans/create-pull-request@v8
        #gt-placeholder-gh-action-create-pr-end
        with:
          branch: 'gt/update/${{ matrix.remote }}'
          title: '${{ steps.determine_versions.outputs.commit_message }}'
          commit-message: '${{ steps.determine_versions.outputs.commit_message }}'
          body: "following the changes after running `gt update -r \"${{ matrix.remote }}\"` and reset gpg keys"
          delete-branch: true
          token: ${{ secrets.AUTO_PR_TOKEN }}
          push-to-fork: ${{ vars.AUTO_PR_FORK_NAME != '' && vars.AUTO_PR_FORK_NAME || secrets.AUTO_PR_FORK_NAME }}

  signing_key:
    name: "Check signing-key"
    runs-on: ubuntu-latest
    steps:

      #gt-placeholder-gh-action-checkout-3-start
      - uses: actions/checkout@v7
      #gt-placeholder-gh-action-checkout-3-end
      - name: check if signing key already are or will expire within the next 3 months
        run: |
          set -euo pipefail
          currentDir="$(pwd)"
          signingKey=".gt/signing-key.public.asc"
          if [[ -f "$currentDir/$signingKey" ]]; then
            tmpDir=$(mktemp -d -t gt-check-gpg-XXXXXXXXXX)
            gpg --homedir "$tmpDir" --import "$currentDir/$signingKey"

            limitTimestamp=$(date -d "+3 month" +%s)
            limitDate=$(date -d "@$limitTimestamp" +"%Y-%m-%dT%H:%M:%S")
            echo "checking if the following public keys defined in $signingKey are valid until $limitDate"
            gpg --homedir "$tmpDir" --list-keys \
              --list-options show-sig-expire,show-unusable-subkeys,show-unusable-uids,show-usage,show-user-notations \
              --keyid-format LONG
            echo ""

            expired=0
            while read -r key; do
              keyId=$(cut -d ':' -f5 <<<"$key")
              expirationTimestamp=$(cut -d ':' -f7 <<<"$key")
              if (( expirationTimestamp < limitTimestamp )); then
                expirationDate=$(date -d "@$((expirationTimestamp + 0))" +"%Y-%m-%dT%H:%M:%S")
                printf >&2 "\033[0;31mERROR\033[0m: expiration date (%s) of key %s is before the given limit %s\n" "$expirationDate" "$keyId" "$limitDate"
                ((++expired))
              fi
            done < <(gpg --homedir "$tmpDir" --list-keys --list-options show-unusable-subkeys --with-colons | grep -E '^(pub|sub)')
            [[ $expired -eq 0 ]]
          else
            echo "$signingKey does not exist in this repo, nothing to check"
          fi

  trusted_keys:
    name: "Check trusted-key(s)"
    runs-on: ubuntu-latest
    steps:
      - name: Import gpg key(s) defined in vars.PUBLIC_GPG_KEYS_WE_TRUST and secrets.PUBLIC_GPG_KEYS_WE_TRUST
        run: |
          gpg --import - <<< "${{ vars.PUBLIC_GPG_KEYS_WE_TRUST }}" && success=true \
            || (echo "could not import GPG keys via vars.PUBLIC_GPG_KEYS_WE_TRUST -- maybe it's not defined"; exit 1) && \
          false || gpg --import - <<< "${{ secrets.PUBLIC_GPG_KEYS_WE_TRUST }}" && success=true \
            || (echo "could not import GPG keys via secrets.PUBLIC_GPG_KEYS_WE_TRUST -- maybe it's not defined"; exit 1) && \
          false || "${success:-false}" && echo "was able to import GPGs either via vars or secrets (or via both -- see above)"
      - name: check if gpg key(s) we trust already are or will expire within the next 3 months
        run: |
          set -euo pipefail
          limitTimestamp=$(date -d "+3 month" +%s)
          limitDate=$(date -d "@$limitTimestamp" +"%Y-%m-%dT%H:%M:%S")
          echo "checking if the following public keys defined in PUBLIC_GPG_KEYS_WE_TRUST are valid until $limitDate"
          gpg --list-keys \
            --list-options show-sig-expire,show-unusable-subkeys,show-unusable-uids,show-usage,show-user-notations \
            --keyid-format LONG
          echo ""
          expired=0
          while read -r key; do
            keyId=$(cut -d ':' -f5 <<<"$key")
            expirationTimestamp=$(cut -d ':' -f7 <<<"$key")
            if (( expirationTimestamp < limitTimestamp )); then
              expirationDate=$(date -d "@$((expirationTimestamp + 0))" +"%Y-%m-%dT%H:%M:%S")
              printf >&2 "\033[0;31mERROR\033[0m: expiration date (%s) of key %s is before the given limit %s\n" "$expirationDate" "$keyId" "$limitDate"
              ((++expired))
            fi
          done < <(gpg --list-keys --list-options show-unusable-subkeys --with-colons | grep -E '^(pub|sub)')
          [[ $expired -eq 0 ]]
